# Render Blueprint — deploys all 4 backend modules from this one repo.
# Import via Render Dashboard -> New -> Blueprint, pointing at this repo.
#
# All 4 services are type: web (public, onrender.com URLs) so everything can
# stay on Render's free plan -- Render's free plan is not available for
# private services (type: pserv), which would otherwise be the better fit
# for service-1/2/3 (nothing outside this backend ever calls them directly).
# They're still protected by their own existing OAuth2/JWT resource-server
# validation regardless of network reachability; they just aren't
# network-isolated the way a pserv would be. Revisit as type: pserv +
# plan: starter if that isolation matters enough to pay for it later.
#
# Fields marked `sync: false` are prompted for during Blueprint creation and
# are never written into this file or committed to git.

services:
  - name: react-spring-okta-gateway
    type: web
    runtime: docker
    dockerfilePath: ./gateway/Dockerfile
    plan: free
    envVars:
      - key: OKTA_ISSUER
        value: https://ntrsoiesys.oktapreview.com/oauth2/aus11aowjcqDJAtVk1d8
      - key: OKTA_AUDIENCE
        value: https://ntrsoiesys.oktapreview.com
      # Public HTTPS URL, not Render's private network (fromService/hostport
      # DNS resolution failed to resolve between these two type: web services
      # for reasons Render's docs don't explain -- UnresolvedAddressException
      # at runtime despite matching region/workspace). All 4 services already
      # validate their own OAuth2/JWT independently, so this loses no security.
      - key: SERVICE_ONE_URL
        value: https://react-spring-okta-service-1.onrender.com
      # After the first deploy, note this service's public onrender.com URL,
      # then set this to "<that-url>/global-token-revocation" and redeploy --
      # this is the same URL you paste into Okta's Logout endpoint field.
      - key: REVOCATION_ENDPOINT_URL
        sync: false
      # Your Vercel deployment's origin, e.g. https://your-app.vercel.app
      # (no trailing slash, no path) -- added to CORS allowed origins
      # alongside http://localhost:5173, no code change needed.
      - key: ALLOWED_ORIGIN
        sync: false

  - name: react-spring-okta-service-1
    type: web
    runtime: docker
    dockerfilePath: ./service-1/Dockerfile
    plan: free
    envVars:
      - key: OKTA_ISSUER
        value: https://ntrsoiesys.oktapreview.com/oauth2/aus11aowjcqDJAtVk1d8
      - key: OKTA_AUDIENCE
        value: https://ntrsoiesys.oktapreview.com
      # Public HTTPS URLs -- see the comment on gateway's SERVICE_ONE_URL above.
      - key: SERVICE_TWO_URL
        value: https://react-spring-okta-service-2.onrender.com
      - key: SERVICE_THREE_URL
        value: https://react-spring-okta-service-3.onrender.com
      - key: SERVICE_TWO_CLIENT_ID
        value: 0oa11b0i0rqMoVAxU1d8
      # Paste the full contents of secrets/service-1-private-key.pem here.
      # Real newlines or "\n"-escaped newlines both work (ServiceTwoTokenProvider
      # unescapes "\n" if present).
      - key: SERVICE_TWO_CLIENT_PRIVATE_KEY
        sync: false
      - key: SERVICE_THREE_CLIENT_ID
        sync: false
      - key: SERVICE_THREE_CLIENT_SECRET
        sync: false

  - name: react-spring-okta-service-2
    type: web
    runtime: docker
    dockerfilePath: ./service-2/Dockerfile
    plan: free
    envVars:
      - key: OKTA_ISSUER
        value: https://ntrsoiesys.oktapreview.com/oauth2/aus11aowjcqDJAtVk1d8
      - key: OKTA_AUDIENCE
        value: https://ntrsoiesys.oktapreview.com

  - name: react-spring-okta-service-3
    type: web
    runtime: docker
    dockerfilePath: ./service-3/Dockerfile
    plan: free
    envVars:
      - key: OKTA_ISSUER
        value: https://ntrsoiesys.oktapreview.com/oauth2/aus11aowjcqDJAtVk1d8
      - key: OKTA_AUDIENCE
        value: https://ntrsoiesys.oktapreview.com
